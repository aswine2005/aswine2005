<svg width="1000" height="240" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aswin E - Software Engineer, DevOps and Cloud, Agentic AI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="240" fill="url(#bg)"/>

  <!-- floating dots -->
  <g fill="#58a6ff" opacity="0.35">
    <circle cx="110" cy="60" r="4"><animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="140" r="3"><animate attributeName="cy" values="140;115;140" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="45" r="2.5"><animate attributeName="cy" values="45;65;45" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="50" r="3"><animate attributeName="cy" values="50;30;50" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="135" r="4"><animate attributeName="cy" values="135;110;135" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="70" r="3"><animate attributeName="cy" values="70;90;70" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moving waves -->
  <path d="M0 205 Q125 175 250 205 T500 205 T750 205 T1000 205 T1250 205 T1500 205 T1750 205 T2000 205 V240 H0Z" fill="#ffffff" opacity="0.08">
    <animateTransform attributeName="transform" type="translate" values="0 0;-500 0" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M0 215 Q125 190 250 215 T500 215 T750 215 T1000 215 T1250 215 T1500 215 T1750 215 T2000 215 V240 H0Z" fill="#58a6ff" opacity="0.12">
    <animateTransform attributeName="transform" type="translate" values="-500 0;0 0" dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- name -->
  <text x="500" y="105" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="4" fill="url(#txt)" opacity="0">
    ASWIN E
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- growing underline -->
  <rect x="400" y="122" width="0" height="3" rx="1.5" fill="#58a6ff">
    <animate attributeName="width" from="0" to="200" dur="1s" begin="1s" fill="freeze"/>
  </rect>

  <!-- subtitle -->
  <text x="500" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="22" fill="#c9d1d9" opacity="0">
    Software Engineer  |  DevOps &amp; Cloud  |  Agentic AI
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.6s" fill="freeze"/>
  </text>
</svg>
